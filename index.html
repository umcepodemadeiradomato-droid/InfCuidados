 

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfCuidados</title>

    <style>
        body {
            background-color: #101827;
            color: #E0E6F0;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #00BFFF;
        }

        .banner img {
            width: 100%;
            max-width: 1000px;
            border: 2px solid #00BFFF;
            border-radius: 15px;
            display: block;
            margin: 20px auto;
        }

        .caixinha {
            background-color: #193B65;
            border: 2px solid #00BFFF;
            border-radius: 15px;
            padding: 40px;
            margin: 20px auto;
            max-width: 500px;
        }

        button {
            background-color: #193B65;
            color: white;
            border: 2px solid #00BFFF;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #00BFFF;
            color: #101827;
        }
    </style>
</head>

<body>

    <div class="banner">
        <img src="infcuidados-banner.png" alt="Banner do InfCuidados">
    </div>

    <div class="caixinha">
        <h1>Bem-vindo ao InfCuidados! 🌱</h1>

        <p>
            Este site foi criado para compartilhar informações
            importantes sobre cuidados, saúde e meio ambiente.
        </p>

        <p>
            Aqui você poderá aprender, descobrir e conhecer
            maneiras de cuidar melhor do nosso mundo!
        </p>

        <button onclick="abrirCuidados()">Clique aqui!</button>
    </div>

    <script>
        function abrirCuidados() {
            alert("Para mais informações, vamos para Cuidados!");
            window.location.href = "Cuidados.html";
        }
    </script>

</body>
</html>
