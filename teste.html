
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Site de Teste</title>

<style>
body {
    background-color: #101827;
    color: #E0E6F0;
    font-family: Arial;
    text-align: center;
    padding: 40px;
}

h1 {
    color: #00BFFF;
}

.caixa {
    background-color: #193B65;
    border: 2px solid #00BFFF;
    border-radius: 12px;
    padding: 25px;
    margin: 20px auto;
    max-width: 500px;
}

button {
    background-color: #193B65;
    color: white;
    border: 2px solid #00BFFF;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background-color: #00BFFF;
    color: #101827;
}
</style>
</head>

<body>

<h1>Site de Teste</h1>

<div class="caixa">
    <h2>Funcionou!</h2>
    <p>Se você está vendo esta mensagem, o HTML e o CSS estão funcionando.</p>

    <button onclick="alert('O botão também funciona!')">
        Testar botão
    </button>
</div>

</body>
</html>
